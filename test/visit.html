<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเยี่ยมบ้าน (พร้อมแผนที่)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="visit.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>บันทึกการเยี่ยมบ้านนักเรียน</h1>
            <a href="index.html" class="back-button">กลับหน้าแรก</a>
        </header>
        <main>
            <div class="main-layout">
                <div class="form-container">
                    <form id="visit-form">
                        <h2>กรอกข้อมูลการเยี่ยมบ้าน</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="student-id">รหัสนักเรียน</label>
                                <input type="text" id="student-id" required>
                            </div>
                            <div class="form-group">
                                <label for="student-name">ชื่อ-สกุล นักเรียน</label>
                                <input type="text" id="student-name" required>
                            </div>
                            <div class="form-group">
                                <label for="parent-name">ชื่อผู้ปกครอง</label>
                                <input type="text" id="parent-name" required>
                            </div>
                            <div class="form-group">
                                <label for="parent-phone">เบอร์โทรศัพท์ผู้ปกครอง</label>
                                <input type="tel" id="parent-phone" required>
                            </div>
                            <div class="form-group">
                                <label for="visit-date">วันที่เยี่ยม</label>
                                <input type="date" id="visit-date" required>
                            </div>
                            <div class="form-group">
                                <label for="teacher-name">ชื่อครูที่ปรึกษา</label>
                                <input type="text" id="teacher-name" required>
                            </div>
                             <div class="form-group form-group-full">
                                <label for="gps-coords">พิกัด GPS (คลิกแผนที่, กรอก, หรือใช้ตำแหน่งปัจจุบัน)</label>
                                <div class="gps-input-group">
                                    <input type="text" id="gps-coords" placeholder="ละติจูด, ลองจิจูด">
                                    <button type="button" id="get-current-location-btn" class="icon-btn" title="ใช้ตำแหน่งปัจจุบัน"><i class="fa-solid fa-location-crosshairs"></i></button>
                                    <button type="button" id="fetch-address-btn" class="fetch-address-btn">ค้นหาที่อยู่</button>
                                </div>
                            </div>
                            <div class="form-group form-group-full">
                                <label for="address">ที่อยู่ที่ได้จาก GPS</label>
                                <textarea id="address" rows="3" readonly></textarea>
                            </div>
                            <div class="form-group form-group-full">
                                <label for="details">รายละเอียดการเยี่ยม</label>
                                <textarea id="details" rows="4"></textarea>
                            </div>
                            <div class="form-group form-group-full">
                                <label for="image-upload">รูปภาพประกอบ</label>
                                <input type="file" id="image-upload" accept="image/*">
                                <img id="image-preview" class="image-preview" src="" alt="ตัวอย่างรูปภาพ">
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">บันทึกข้อมูล</button>
                    </form>
                </div>
                <div class="map-container">
                    <h2>แผนที่แสดงตำแหน่งบ้านนักเรียน</h2>
                    <div id="map"></div>
                </div>
            </div>

            <div class="visit-list-container">
                <h2>รายการเยี่ยมบ้าน</h2>
                <div id="visit-list"></div>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="visit.js"></script>
</body>
</html>
